name: Poll MacroPulse-X and Build Unsigned IPA

# MacroPulse-X (github.com/itszspikey-dotcom/MacroPulse-X) is synced directly from
# Google AI Studio. AI Studio's "commit and push" does a full mirror overwrite of that
# repo's tree, discarding anything it doesn't recognize as its own — so a CI workflow,
# Capacitor config, or patched source file committed there gets wiped on the next sync.
#
# This repo solves that by never touching MacroPulse-X's tree at all: it polls
# MacroPulse-X's latest commit on a cheap runner, and only when it changes, spins up a
# macOS runner that clones MacroPulse-X fresh into a throwaway workspace, layers the
# Capacitor project + Gemini fetch-shim on top of that clone (from patches/ below),
# builds, and publishes — without ever writing back to MacroPulse-X.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      new_commit: ${{ steps.check.outputs.new_commit }}
      latest_sha: ${{ steps.check.outputs.latest_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          set -euo pipefail
          LATEST_SHA=$(curl -sf https://api.github.com/repos/itszspikey-dotcom/MacroPulse-X/commits/main | jq -r .sha)
          LAST_BUILT=$(cat .last-built-sha 2>/dev/null || echo "none")
          echo "Latest MacroPulse-X commit: $LATEST_SHA"
          echo "Last built commit:          $LAST_BUILT"
          echo "latest_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "null" ] && [ "$LATEST_SHA" != "$LAST_BUILT" ]; then
            echo "new_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_commit=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.new_commit == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout builder repo (patches, config, apps.json)
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout fresh MacroPulse-X source
        uses: actions/checkout@v4
        with:
          repository: itszspikey-dotcom/MacroPulse-X
          ref: main
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Layer Capacitor + Gemini fetch-shim onto the fresh AI Studio source
        run: |
          set -euo pipefail
          cp builder/patches/geminiClient.ts source/src/services/geminiClient.ts
          cp builder/patches/geminiFetchShim.ts source/src/geminiFetchShim.ts
          # source/ is a fresh clone every run, so no idempotency concerns here.
          { echo "import './geminiFetchShim';"; cat source/src/main.tsx; } > source/src/main.tsx.tmp
          mv source/src/main.tsx.tmp source/src/main.tsx
          cp builder/capacitor.config.json source/capacitor.config.json
          cp builder/icon.png source/icon.png

      - name: Build Web App and Generate iOS Project
        working-directory: source
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          npm install

          # AI Studio's generated commits don't always declare every package the
          # source actually imports (e.g. `firebase` was missing entirely). Install
          # anything listed in extra-deps.txt regardless of what's in package.json.
          if [ -f "../builder/patches/extra-deps.txt" ]; then
            EXTRA_DEPS=$(grep -v '^#' ../builder/patches/extra-deps.txt | grep -v '^\s*$' | tr '\n' ' ')
            if [ -n "$EXTRA_DEPS" ]; then
              echo "Installing extra deps not declared in package.json: $EXTRA_DEPS"
              npm install $EXTRA_DEPS
            fi
          fi

          npm run build

          npm install @capacitor/core @capacitor/cli @capacitor/ios @capacitor/assets
          npx cap add ios

          # Required privacy usage descriptions. Without these, iOS hard-crashes the
          # app the instant it touches camera/photo-library APIs (barcode scanner,
          # AI food scanner) — Capacitor's default Info.plist template omits them.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'MacroPulse needs camera access to scan barcodes and recognize meals for calorie tracking.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'MacroPulse needs photo library access so you can select meal photos for AI food recognition.'" "$PLIST"

          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            npx @capacitor/assets generate --ios
          fi

          npx cap sync ios

      - name: Compile Xcode Archive
        working-directory: source
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        working-directory: source
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r MacroPulse.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroPulse-Unsigned-IPA
          path: source/build/MacroPulse.ipa

      - name: Publish GitHub Release (for apps.json downloadURL)
        working-directory: builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ../source/build/MacroPulse.ipa \
            --title "MacroPulse (latest unsigned build)" \
            --notes "Auto-built from MacroPulse-X@${{ needs.check.outputs.latest_sha }} on $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Record last built commit SHA
        working-directory: builder
        run: |
          echo "${{ needs.check.outputs.latest_sha }}" > .last-built-sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-built-sha
          git commit -m "Mark MacroPulse-X@${{ needs.check.outputs.latest_sha }} as built" || echo "Nothing to commit"
          git push
