name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web App and Generate Assets
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/.*" -exec dirname {} \;)
          cd "$TARGET_DIR"
          echo "Working in directory: $(pwd)"

          # 1. Build Web Assets
          npm install
          npm run build

          # 2. Add Capacitor iOS
          npm install @capacitor/core @capacitor/cli @capacitor/ios @capacitor/assets
          npx cap add ios

          # 3. Auto-generate iOS app icons from icon.png if present
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            npx @capacitor/assets generate --ios
          fi

          npx cap sync ios

      - name: Compile Xcode Archive
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/.*" -exec dirname {} \;)
          cd "$TARGET_DIR"

          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/.*" -exec dirname {} \;)
          cd "$TARGET_DIR"

          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r MacroPulse.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroPulse-Unsigned-IPA
          path: "**/build/MacroPulse.ipa"

      - name: Publish GitHub Release (for apps.json downloadURL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/.*" -exec dirname {} \;)
          IPA_PATH="$TARGET_DIR/build/MacroPulse.ipa"

          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$IPA_PATH" \
            --title "MacroPulse (latest unsigned build)" \
            --notes "Automated unsigned build from commit ${GITHUB_SHA::7} on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
